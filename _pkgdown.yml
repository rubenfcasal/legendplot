url: https://rubenfcasal.github.io/legendplot/

template:
  bootstrap: 5
  # light-switch: true
  bootswatch: flatly # lumen

news:
  cran_dates: false

figures:
  fig.width: 7
  fig.height: 5
  other.parameters:
    rgl:
      fig.width: 6
      fig.height: 4
      fig.asp: 1


reference:
  - contents:
      - legendplot-package
  - title: "Standard plots with legends"
    desc: "Functions for creating standard R plots with continuous or categorical legends."
    contents:
      - splot
      - spoints
      - simage
      - spersp
      - fplot
      - fpoints
      - par.reset
  - title: "'rgl' plots with legends"
    desc: "Functions for creating 'rgl' 3d plots with continuous or categorical legends."
    contents:
      - splot3d
      - spoints3d
      - spersp3d
      - sshade3d
      - fplot3d
      - fpoints3d
      - fshade3d
  - title: "Color tools"
    desc: "Color palettes and functions for assigning colors to values."
    contents:
      - scolor
      - jet.colors
      - hot.colors
      - fcolor
      - hcld.colors
      - cat.colors
  - title: "'rgl' tools"
    desc: "Utilities for working with the 'rgl' package."
    contents:
      - new3d
      - vb2tri3d
      - addviewpoint3d
      - setviewpoint3d
      - lsviewpoints3d
      - rmviewpoints3d
      - getviewpoints3d
      - getview3d
      - setview3d
      - setmouse3d
      - pan3d
      - dbltrack3d
      - axis3
  - title: "Data"
    desc: "Examples of data and 3d objects."
    contents:
      - volcanom
